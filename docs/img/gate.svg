<svg xmlns="http://www.w3.org/2000/svg" width="1004" height="290" viewBox="0 0 1004 290" role="img" aria-labelledby="gate-title gate-desc">
  <title id="gate-title">What /gate does</title>
  <desc id="gate-desc">code-reviewer reads domainAxes, DECISIONS.md and CLAUDE.md and reviews your diff with clean context. Mechanical findings are applied automatically; judgment calls are asked. Then test-writer writes tests, the project's gates run, and lanes reviewed marks the diff's fingerprint.</desc>
  <style>
    .bg{fill:#F5F7F6}
    .box{fill:#FFFFFF;stroke:#131A17;stroke-width:1.25}
    .warnbox{fill:#F3E6C4;stroke:#B07A0C;stroke-width:1.5}
    .tag{fill:#DCE3E0}
    .ln{fill:none;stroke:#131A17;stroke-width:1.25}
    .ah{fill:#131A17}
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:13px;fill:#131A17}
    .mono,.lab,.eye,.tagt{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .title{font-size:16px;font-weight:600}
    .title.mono{font-size:15px}
    .sub{fill:#4D5A54}
    .lab{font-size:12px;fill:#4D5A54}
    .eye{font-size:11.5px;fill:#4D5A54}
    .tagt{font-size:12px}
    @media (prefers-color-scheme: dark){
      .bg{fill:#151B19}
      .box{fill:#1C2421;stroke:#E2E9E6}
      .warnbox{fill:#3A3120;stroke:#E0AE45}
      .tag{fill:#2A3430}
      .ln{stroke:#E2E9E6}
      .ah{fill:#E2E9E6}
      text{fill:#E2E9E6}
      .sub,.lab,.eye{fill:#9DAAA4}
    }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path class="ah" d="M0,1 L9,5 L0,9 z"/></marker>
  </defs>
  <rect class="bg" width="1004" height="290" rx="8"/>
  <g transform="translate(20,14)">
    <rect class="tag" x="8.5" y="20" width="88" height="26" rx="3"/>
    <text x="52.5" y="37" text-anchor="middle" class="tagt">domainAxes</text>
    <rect class="tag" x="104.5" y="20" width="102" height="26" rx="3"/>
    <text x="155.5" y="37" text-anchor="middle" class="tagt">DECISIONS.md</text>
    <rect class="tag" x="214.5" y="20" width="81" height="26" rx="3"/>
    <text x="255" y="37" text-anchor="middle" class="tagt">CLAUDE.md</text>
    <path class="ln" d="M52.5,46 V66 M155.5,46 V66 M255,46 V66 M52.5,66 H255"/>
    <line class="ln" x1="152" y1="66" x2="152" y2="128" marker-end="url(#ah)"/>
    <text x="160" y="101" class="lab">reads</text>

    <line class="ln" x1="0" y1="160" x2="70" y2="160" marker-end="url(#ah)"/>
    <text x="35" y="150" text-anchor="middle" class="lab">your diff</text>

    <rect class="box" x="72" y="130" width="160" height="60" rx="4"/>
    <text x="152" y="156" text-anchor="middle" class="title mono">code-reviewer</text>
    <text x="152" y="176" text-anchor="middle" class="sub">clean context</text>

    <path class="ln" d="M232,160 H252 V86 H298" marker-end="url(#ah)"/>
    <path class="ln" d="M252,160 V234 H298" marker-end="url(#ah)"/>

    <rect class="box" x="300" y="58" width="130" height="56" rx="4"/>
    <text x="365" y="79" text-anchor="middle" class="eye">mechanical</text>
    <text x="365" y="100" text-anchor="middle" class="title">auto-applied</text>
    <rect class="warnbox" x="300" y="206" width="130" height="56" rx="4"/>
    <text x="365" y="227" text-anchor="middle" class="eye">judgment call</text>
    <text x="365" y="248" text-anchor="middle" class="title">asks you</text>

    <path class="ln" d="M430,86 H455 V160"/>
    <path class="ln" d="M430,234 H455 V160"/>
    <line class="ln" x1="455" y1="160" x2="478" y2="160" marker-end="url(#ah)"/>

    <rect class="box" x="480" y="130" width="130" height="60" rx="4"/>
    <text x="545" y="156" text-anchor="middle" class="title mono">test-writer</text>
    <text x="545" y="176" text-anchor="middle" class="sub">writes tests</text>
    <line class="ln" x1="610" y1="160" x2="645" y2="160" marker-end="url(#ah)"/>

    <rect class="box" x="647" y="130" width="130" height="60" rx="4"/>
    <text x="712" y="165" text-anchor="middle" class="title">project gates</text>
    <text x="712" y="212" text-anchor="middle" class="lab">lint · typecheck · test</text>
    <text x="712" y="229" text-anchor="middle" class="sub">failures warn, never block</text>

    <line class="ln" x1="777" y1="160" x2="822" y2="160" marker-end="url(#ah)"/>
    <text x="799.5" y="150" text-anchor="middle" class="lab">marks</text>

    <rect class="box" x="824" y="130" width="150" height="60" rx="4"/>
    <text x="899" y="165" text-anchor="middle" class="title mono">lanes reviewed</text>
    <text x="899" y="212" text-anchor="middle" class="sub">diff fingerprint</text>
  </g>
</svg>
